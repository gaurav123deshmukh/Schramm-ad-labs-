<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=5, user-scalable=yes">
    <title>Coming Soon | Schramm AdLabs</title>
    <meta name="description" content="Creative. Digital. Impact. Schramm AdLabs is launching soon.">
    
    <!-- Favicon -->
    <link rel="icon" href="ad labs_3.webp" type="image/webp">
    
    <!-- Google Fonts & Font Awesome (Matching Brochure Theme) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&family=Montserrat:wght@500;700;800&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css" rel="stylesheet">

    <style>
        /* Schramm Ad Labs - Premium Brochure Theme Variables */
        :root {
            --primary-blue: #0973BA;
            --secondary-teal: #1cb5e0;
            --dark-blue: #042A4A;
            --text-dark: #1A1A1A;
            --white: #FFFFFF;
            --transition: all 0.4s cubic-bezier(0.25, 0.8, 0.25, 1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            color: var(--white);
            /* Rich Gradient Background from Brochure Theme */
            background: linear-gradient(135deg, var(--dark-blue) 0%, var(--primary-blue) 50%, var(--secondary-teal) 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
        }

        h1, h2, h3, h4 { 
            font-family: 'Montserrat', sans-serif; 
        }

        /* Main Centered Content */
        .main-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 20px;
            position: relative;
            z-index: 2;
        }

        /* Logo Badge Presentation */
        .logo-badge {
            width: 160px;
            height: 160px;
            border-radius: 50%;
            object-fit: cover;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.25);
            border: 3px solid rgba(255, 255, 255, 0.2);
            margin-bottom: 35px;
            transition: var(--transition);
        }

        .logo-badge:hover {
            transform: translateY(-5px);
            box-shadow: 0 20px 45px rgba(0, 0, 0, 0.35);
            border-color: var(--white);
        }

        /* Typography */
        h1 {
            font-size: clamp(3.2rem, 8vw, 5.5rem);
            font-weight: 800;
            line-height: 1.1;
            margin-bottom: 15px;
            text-shadow: 0 4px 15px rgba(0,0,0,0.2);
            letter-spacing: -1px;
        }

        p.subtitle {
            font-size: 1.25rem;
            font-weight: 300;
            max-width: 600px;
            margin: 0 auto;
            opacity: 0.9;
            letter-spacing: 1px;
        }

        /* Wave Shape Divider (Connects to Footer) */
        .custom-shape-divider-bottom {
            position: absolute; 
            bottom: 0; 
            left: 0; 
            width: 100%; 
            overflow: hidden; 
            line-height: 0;
        }
        
        .custom-shape-divider-bottom svg { 
            position: relative; 
            display: block; 
            width: calc(100% + 1.3px); 
            height: 70px; 
        }
        
        .custom-shape-divider-bottom .shape-fill { 
            fill: var(--dark-blue); 
        }

        /* Minimal Footer */
        footer { 
            background: var(--dark-blue); 
            color: var(--white); 
            padding: 40px 20px 25px; 
            position: relative; 
            z-index: 3; 
            text-align: center;
        }

        .footer-links {
            display: flex; 
            justify-content: center; 
            gap: 30px; 
            margin-bottom: 25px; 
            flex-wrap: wrap;
        }

        .footer-links span {
            font-size: 0.95rem; 
            color: rgba(255,255,255,0.8);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .footer-links i { 
            color: var(--secondary-teal); 
        }

        .footer-bottom {
            padding-top: 20px; 
            border-top: 1px solid rgba(255,255,255,0.1); 
            color: rgba(255,255,255,0.5); 
            font-size: 0.85rem;
        }
    </style>
</head>
<body>

    <!-- Main Coming Soon Section -->
    <main class="main-content">
        
        <img src="ad labs_3.webp" alt="Schramm AdLabs" class="logo-badge">
        
        <h1>Coming Soon</h1>
        <p class="subtitle">Creative. Digital. Impact. <br>We are preparing something extraordinary.</p>
        
        <!-- Decorative Wave connecting to footer -->
        <div class="custom-shape-divider-bottom">
            <svg data-name="Layer 1" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 120" preserveAspectRatio="none">
                <path d="M321.39,56.44c58-10.79,114.16-30.13,172-41.86,82.39-16.72,168.19-17.73,250.45-.39C823.78,31,906.67,72,985.66,92.83c70.05,18.48,146.53,26.09,214.34,3V0H0V27.35A600.21,600.21,0,0,0,321.39,56.44Z" class="shape-fill"></path>
            </svg>
        </div>
    </main>

    <!-- Bottom Footer Details -->
    <footer>
        <div class="footer-links">
            <span><i class="fa-solid fa-phone"></i> +91 8655695279</span>
            <span><i class="fa-solid fa-envelope"></i> schrammadlabs@kbjindia.com</span>
            <span><i class="fa-solid fa-location-dot"></i> CBD Belapur, Navi Mumbai</span>
        </div>
        <div class="footer-bottom">
            <p>&copy; 2026 Schramm AdLabs | A Division of KBJ HR INDIA PRIVATE LIMITED.</p>
        </div>
    </footer>

</body>
</html>
